syntax = "proto3";

package smartvalue;

service PredictionService {
  rpc Predict (PredictionRequest) returns (PredictionResponse);
}

message PredictionRequest {
  string district = 1;
  string rooms = 2;
  int32 square_meters = 3;
  int32 building_age = 4;
}

message PredictionResponse {
  double min_price = 1;
  double max_price = 2;
  double confidence = 3;
  string model_version = 4;
}